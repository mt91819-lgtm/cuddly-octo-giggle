<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كود المدير المتغيّر — Cashier Pro</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Cairo', 'Tahoma', sans-serif;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #111a2e;
        border: 1px solid #243048;
        border-radius: 18px;
        padding: 26px;
        width: 360px;
        max-width: 94vw;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      h1 { font-size: 1.15rem; margin: 0 0 4px; }
      .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 18px; }
      .code {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 8px;
        color: #fff;
        font-family: 'Courier New', monospace;
        direction: ltr;
        margin: 10px 0;
      }
      .left { color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; }
      .bar { height: 6px; background: #243048; border-radius: 4px; overflow: hidden; margin: 14px 0; }
      .bar > i { display: block; height: 100%; background: #2563eb; transition: width 1s linear; }
      label { display: block; text-align: right; font-size: 0.85rem; margin: 14px 0 6px; font-weight: 700; }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #243048;
        border-radius: 10px;
        background: #16223c;
        color: #e2e8f0;
        font-family: 'Courier New', monospace;
        direction: ltr;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      .ghost { background: transparent; border: 1px solid #243048; color: #cbd5e1; }
      .hidden { display: none; }
      .note { color: #64748b; font-size: 0.78rem; margin-top: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🔐 كود المدير المتغيّر</h1>
      <div class="sub">يتغيّر تلقائيًا كل ساعتين — يعمل بدون إنترنت</div>

      <div id="setup">
        <label>الصق سر المدير (من شاشة الموظفين في النظام)</label>
        <input id="secret-in" placeholder="مثال: 3f9a1c..." autocomplete="off" />
        <button id="save">حفظ السر وعرض الكود</button>
      </div>

      <div id="view" class="hidden">
        <div class="code" id="code">------</div>
        <div class="left" id="left"></div>
        <div class="bar"><i id="bar"></i></div>
        <button class="ghost" id="change">تغيير السر</button>
      </div>

      <div class="note">
        السر يُحفظ على هذا الجهاز فقط. أعطِ الموظف <strong>الكود الظاهر</strong> (وليس السر) عند الحاجة.
        <br />💡 بعد إدخال السر، استخدم «إضافة إلى الشاشة الرئيسية» ليبقى محفوظًا دائمًا بدون إنترنت.
      </div>
    </div>

    <script>
      /* نفس خوارزمية js/rotatingcode.js بالضبط — مضمّنة ليعمل الملف مستقلًا */
      var RotatingCode = (function () {
        var PERIOD_MS = 2 * 60 * 60 * 1000;
        function _sha256Hex(ascii) {
          function rightRotate(value, amount) {
            return (value >>> amount) | (value << (32 - amount));
          }
          var mathPow = Math.pow;
          var maxWord = mathPow(2, 32);
          var result = '';
          var words = [];
          var asciiBitLength = ascii.length * 8;
          var hash = _sha256Hex.h || (_sha256Hex.h = []);
          var k = _sha256Hex.k || (_sha256Hex.k = []);
          var primeCounter = k.length;
          if (!primeCounter) {
            var isComposite = {};
            for (var candidate = 2, p = 0; p < 64; candidate++) {
              if (!isComposite[candidate]) {
                for (var i0 = 0; i0 < 313; i0 += candidate) isComposite[i0] = candidate;
                hash[p] = (mathPow(candidate, 0.5) * maxWord) | 0;
                k[p++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
              }
            }
          }
          ascii += '\x80';
          while ((ascii.length % 64) - 56) ascii += '\x00';
          for (var i = 0; i < ascii.length; i++) {
            var j = ascii.charCodeAt(i);
            if (j >> 8) return;
            words[i >> 2] |= j << (((3 - i) % 4) * 8);
          }
          words[words.length] = (asciiBitLength / maxWord) | 0;
          words[words.length] = asciiBitLength;
          for (var jj = 0; jj < words.length; ) {
            var w = words.slice(jj, (jj += 16));
            var oldHash = hash;
            hash = hash.slice(0, 8);
            for (var i2 = 0; i2 < 64; i2++) {
              var w15 = w[i2 - 15];
              var w2 = w[i2 - 2];
              var a = hash[0];
              var e = hash[4];
              var temp1 =
                hash[7] +
                (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
                ((e & hash[5]) ^ (~e & hash[6])) +
                k[i2] +
                (w[i2] =
                  i2 < 16
                    ? w[i2]
                    : (w[i2 - 16] +
                        (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                        w[i2 - 7] +
                        (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                      0);
              var temp2 =
                (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
                ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
              hash = [(temp1 + temp2) | 0].concat(hash);
              hash[4] = (hash[4] + temp1) | 0;
            }
            for (var i3 = 0; i3 < 8; i3++) hash[i3] = (hash[i3] + oldHash[i3]) | 0;
          }
          for (var i4 = 0; i4 < 8; i4++) {
            for (var j4 = 3; j4 + 1; j4--) {
              var b = (hash[i4] >> (j4 * 8)) & 255;
              result += (b < 16 ? '0' : '') + b.toString(16);
            }
          }
          return result;
        }
        function _utf8(s) {
          return unescape(encodeURIComponent(s));
        }
        function windowIndex(ts) {
          return Math.floor((ts || Date.now()) / PERIOD_MS);
        }
        function codeForWindow(secret, win) {
          var h = _sha256Hex(_utf8(String(secret) + ':' + win));
          var num = parseInt(h.slice(0, 8), 16) % 1000000;
          return String(num).padStart(6, '0');
        }
        function current(secret, ts) {
          return codeForWindow(secret, windowIndex(ts));
        }
        function msToNext(ts) {
          var t = ts || Date.now();
          return PERIOD_MS - (t % PERIOD_MS);
        }
        return { current: current, msToNext: msToNext, PERIOD_MS: PERIOD_MS };
      })();

      var KEY = 'cashier_manager_secret';
      var setup = document.getElementById('setup');
      var view = document.getElementById('view');
      var timer = null;
      var mem = {};

      /* تخزين آمن: localStorage قد يرمي استثناء عند فتح الملف محليًا على الموبايل،
         لذا نلتقط الخطأ ونستخدم بديلًا في الذاكرة. */
      function lsGet(k) {
        try {
          return localStorage.getItem(k);
        } catch (e) {
          return mem[k] || null;
        }
      }
      function lsSet(k, v) {
        try {
          localStorage.setItem(k, v);
        } catch (e) {
          mem[k] = v;
        }
      }

      /* السر يُحفظ أيضًا في رابط الصفحة (#) ليبقى حتى لو تعطّل التخزين —
         فقط «أضِف إلى الشاشة الرئيسية» بعد الإدخال. */
      function hashSecret() {
        var m = (location.hash || '').match(/s=([^&]+)/);
        return m ? decodeURIComponent(m[1]) : null;
      }

      function tick(secret) {
        var now = Date.now();
        document.getElementById('code').textContent = RotatingCode.current(secret, now);
        var ms = RotatingCode.msToNext(now);
        var mn = Math.floor(ms / 60000);
        var s = Math.floor((ms % 60000) / 1000);
        document.getElementById('left').textContent =
          'يتغيّر خلال ' + mn + ':' + String(s).padStart(2, '0');
        document.getElementById('bar').style.width =
          (100 * (ms / RotatingCode.PERIOD_MS)).toFixed(1) + '%';
      }

      function showView(secret) {
        setup.classList.add('hidden');
        view.classList.remove('hidden');
        tick(secret);
        clearInterval(timer);
        timer = setInterval(function () {
          tick(secret);
        }, 1000);
      }

      function showSetup() {
        clearInterval(timer);
        view.classList.add('hidden');
        setup.classList.remove('hidden');
        document.getElementById('secret-in').value = '';
      }

      document.getElementById('save').onclick = function () {
        var v = document.getElementById('secret-in').value.trim();
        if (!v) return;
        lsSet(KEY, v);
        try {
          location.hash = 's=' + encodeURIComponent(v);
        } catch (e) {}
        showView(v);
      };
      // الضغط على Enter/Go في لوحة المفاتيح يعمل مثل زر الحفظ
      document.getElementById('secret-in').onkeydown = function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('save').onclick();
        }
      };
      document.getElementById('change').onclick = function () {
        try {
          lsSet(KEY, '');
          location.hash = '';
        } catch (e) {}
        showSetup();
      };

      /* بدء آمن: أي خطأ لا يجب أن يترك الصفحة فارغة */
      try {
        var saved = hashSecret() || lsGet(KEY);
        if (saved) showView(saved);
        else showSetup();
      } catch (e) {
        showSetup();
      }
    </script>
  </body>
</html>
