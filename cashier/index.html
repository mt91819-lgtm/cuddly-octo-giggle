<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashier Pro Offline — نظام كاشير</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="loading">جارٍ تشغيل النظام…</div>
    </div>

    <!-- عرض أي خطأ غير متوقع بدل ترك الشاشة بيضاء -->
    <script>
      window.addEventListener('error', function (e) {
        var app = document.getElementById('app');
        if (app) {
          app.innerHTML =
            '<div class="fatal">حدث خطأ أثناء التشغيل:<br>' +
            (e.message || e.error || 'خطأ غير معروف') +
            '<br><small>افتح أدوات المطوّر (F12) ← Console لمزيد من التفاصيل.</small></div>';
        }
      });
    </script>

    <!-- ترتيب التحميل مهم: قاعدة البيانات أولًا، ثم الوحدات، ثم المتحكم -->
    <script src="js/db.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/rotatingcode.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/products.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/receipt.js"></script>
    <script src="js/pos.js"></script>
    <script src="js/returns.js"></script>
    <script src="js/users.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/shifts.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/health.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
