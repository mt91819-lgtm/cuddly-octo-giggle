<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2050" viewBox="0 0 1500 2050" font-family="Noto Kufi Arabic, Noto Naskh Arabic, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="meta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="srv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowG" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <style>
      .h1{font-size:38px;font-weight:700;fill:#f8fafc}
      .h2{font-size:30px;font-weight:700;fill:#fdba74}
      .lbl{font-size:26px;font-weight:700;fill:#0f172a;font-family:"Noto Naskh Arabic"}
      .sub{font-size:21px;fill:#0f172a;font-family:"Noto Naskh Arabic"}
      .note{font-size:22px;fill:#cbd5e1;font-family:"Noto Naskh Arabic"}
      .tag{font-size:20px;font-weight:700;fill:#e2e8f0;font-family:"Noto Naskh Arabic"}
      .step{font-size:24px;font-weight:700;fill:#fff}
      .white{fill:#f8fafc}
    </style>
  </defs>

  <rect width="1500" height="2050" fill="url(#bg)"/>
  <text x="750" y="68" class="h1" text-anchor="middle" direction="rtl">رحلة العميل في الـ CRM الأونلاين — من رسالة واتساب لأوردر</text>
  <line x1="120" y1="95" x2="1380" y2="95" stroke="#475569" stroke-width="2"/>

  <!-- ============ القسم 1: الأوتوميشن ============ -->
  <text x="1380" y="160" class="h2" text-anchor="end" direction="rtl">①  العميل يبدأ المحادثة ← يتسجّل Lead تلقائيًا</text>

  <!-- العميل -->
  <g>
    <rect x="1130" y="195" width="250" height="150" rx="20" fill="url(#cust)"/>
    <text x="1255" y="255" text-anchor="middle" font-size="48">👤</text>
    <text x="1255" y="300" class="lbl" text-anchor="middle">العميل</text>
    <text x="1255" y="330" class="sub" text-anchor="middle">يبعت رسالة واتساب</text>
  </g>
  <!-- واتساب/ميتا -->
  <g>
    <rect x="800" y="195" width="250" height="150" rx="20" fill="url(#meta)"/>
    <text x="925" y="255" text-anchor="middle" font-size="48">📱</text>
    <text x="925" y="300" class="lbl" text-anchor="middle">واتساب (Meta)</text>
    <text x="925" y="330" class="sub" text-anchor="middle">ساعي البريد</text>
  </g>
  <!-- السيرفر -->
  <g>
    <rect x="470" y="195" width="250" height="150" rx="20" fill="url(#srv)"/>
    <text x="595" y="255" text-anchor="middle" font-size="48">☁️</text>
    <text x="595" y="300" class="lbl" text-anchor="middle" fill="#fff">السيرفر بتاعك</text>
    <text x="595" y="330" class="sub" text-anchor="middle" fill="#ede9fe">بياخد القرار</text>
  </g>
  <!-- قاعدة البيانات -->
  <g>
    <rect x="140" y="195" width="250" height="150" rx="20" fill="url(#db)"/>
    <text x="265" y="255" text-anchor="middle" font-size="48">🗄️</text>
    <text x="265" y="300" class="lbl" text-anchor="middle">قاعدة البيانات</text>
    <text x="265" y="330" class="sub" text-anchor="middle">يتخزّن الـ Lead</text>
  </g>

  <!-- أسهم (من اليمين لليسار) -->
  <line x1="1130" y1="270" x2="1055" y2="270" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="800"  y1="270" x2="725"  y2="270" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="470"  y1="270" x2="395"  y2="270" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="762" y="385" class="note" text-anchor="middle">Webhook</text>
  <text x="595" y="385" class="note" text-anchor="middle">«موجود قبل كده؟»</text>

  <!-- صندوق القرار -->
  <rect x="140" y="420" width="1240" height="120" rx="16" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <text x="1360" y="465" class="tag" text-anchor="end" direction="rtl">قرار السيرفر لما يلاقي الرقم:</text>
  <rect x="720" y="478" width="300" height="48" rx="10" fill="#7f1d1d"/>
  <text x="870" y="511" class="tag" text-anchor="middle" direction="rtl">❌ مش موجود ← اعمله Lead جديد</text>
  <rect x="170" y="478" width="300" height="48" rx="10" fill="#064e3b"/>
  <text x="320" y="511" class="tag" text-anchor="middle" direction="rtl">✅ موجود ← سيبه زي ما هو</text>

  <!-- ============ القسم 2: السيرفر vs ميتا ============ -->
  <text x="1380" y="630" class="h2" text-anchor="end" direction="rtl">②  السيرفر وميتا حاجتين منفصلتين — انت بتوصّلهم بالرابط بس</text>

  <rect x="780" y="665" width="600" height="230" rx="20" fill="#1e293b" stroke="#7c3aed" stroke-width="3"/>
  <text x="1350" y="715" class="tag" text-anchor="end" direction="rtl">🏠 السيرفر (استضافة)</text>
  <text x="1350" y="755" class="note" text-anchor="end" direction="rtl">بتأجّره من شركة استضافة — مش ميتا:</text>
  <text x="1350" y="795" class="note" text-anchor="end" direction="rtl">Hostinger / DigitalOcean / Railway</text>
  <text x="1350" y="835" class="note" text-anchor="end" direction="rtl">كود الـ ERP شغّال هنا (~5$ شهريًا)</text>
  <text x="1350" y="875" class="note" text-anchor="end" direction="rtl">https://myerp.com</text>

  <rect x="120" y="665" width="600" height="230" rx="20" fill="#1e293b" stroke="#059669" stroke-width="3"/>
  <text x="690" y="715" class="tag" text-anchor="end" direction="rtl">🏢 ميتا (واتساب)</text>
  <text x="690" y="755" class="note" text-anchor="end" direction="rtl">شركة تانية خالص — مش عندها كودك</text>
  <text x="690" y="795" class="note" text-anchor="end" direction="rtl">هي بس بتبعتلك الرسايل اللي بتوصلها</text>
  <text x="690" y="835" class="note" text-anchor="end" direction="rtl">انت بتديها رابط الـ Webhook بتاعك:</text>
  <text x="690" y="875" class="note" text-anchor="end" direction="rtl">https://myerp.com/whatsapp 🔗</text>

  <line x1="780" y1="780" x2="725" y2="780" stroke="#34d399" stroke-width="4" marker-end="url(#arrowG)"/>
  <line x1="720" y1="810" x2="775" y2="810" stroke="#34d399" stroke-width="4" marker-end="url(#arrowG)"/>

  <!-- تنبيه الموافقة -->
  <rect x="120" y="915" width="1260" height="70" rx="14" fill="#3b1d0b" stroke="#d97706" stroke-width="2"/>
  <text x="1360" y="958" class="tag" text-anchor="end" direction="rtl">⚠️ ميتا مابتوافقش على طول: تحقّق من النشاط التجاري + اعتماد قوالب الرسائل (من يوم لأسبوع)</text>

  <!-- ============ القسم 3: رحلة العميل ============ -->
  <text x="1380" y="1075" class="h2" text-anchor="end" direction="rtl">③  رحلة العميل (Lifecycle) — سلّم بيطلعه خطوة خطوة</text>

  <!-- 4 مراحل -->
  <g>
    <rect x="1090" y="1110" width="290" height="150" rx="18" fill="#0e7490"/>
    <text x="1235" y="1165" class="step" text-anchor="middle">Lead</text>
    <text x="1235" y="1205" class="sub" text-anchor="middle" fill="#e0f2fe">كلّمك على واتساب بس</text>
    <text x="1235" y="1238" class="sub" text-anchor="middle" fill="#e0f2fe">source = WhatsApp</text>
  </g>
  <g>
    <rect x="775" y="1110" width="290" height="150" rx="18" fill="#6d28d9"/>
    <text x="920" y="1165" class="step" text-anchor="middle">Opportunity</text>
    <text x="920" y="1205" class="sub" text-anchor="middle" fill="#ede9fe">مهتم / بيفاوض</text>
    <text x="920" y="1238" class="sub" text-anchor="middle" fill="#ede9fe">سأل عن سعر/متاح؟</text>
  </g>
  <g>
    <rect x="460" y="1110" width="290" height="150" rx="18" fill="#059669"/>
    <text x="605" y="1165" class="step" text-anchor="middle">Customer</text>
    <text x="605" y="1205" class="sub" text-anchor="middle" fill="#d1fae5">عمل أوردر فعلاً ✅</text>
    <text x="605" y="1238" class="sub" text-anchor="middle" fill="#d1fae5">اتربط بفاتورته</text>
  </g>
  <g>
    <rect x="145" y="1110" width="290" height="150" rx="18" fill="#b45309"/>
    <text x="290" y="1165" class="step" text-anchor="middle">Repeat / VIP</text>
    <text x="290" y="1205" class="sub" text-anchor="middle" fill="#fef3c7">بيشتري بانتظام</text>
    <text x="290" y="1238" class="sub" text-anchor="middle" fill="#fef3c7">5 أوردرات+ ← VIP</text>
  </g>

  <line x1="1090" y1="1185" x2="1070" y2="1185" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="775"  y1="1185" x2="755"  y2="1185" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="460"  y1="1185" x2="440"  y2="1185" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- ============ القسم 4: تريجر الأوردر ============ -->
  <text x="1380" y="1380" class="h2" text-anchor="end" direction="rtl">④  النظام بيعرف بالأوردر إزاي؟ الأوردر بيتعمل جوّه النظام (مش من نص الرسالة)</text>

  <rect x="980" y="1415" width="400" height="200" rx="18" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
  <text x="1350" y="1460" class="tag" text-anchor="end" direction="rtl">🖥️ من الكاشير</text>
  <text x="1350" y="1500" class="note" text-anchor="end" direction="rtl">الموظف يختار العميل</text>
  <text x="1350" y="1538" class="note" text-anchor="end" direction="rtl">يضيف المنتجات</text>
  <text x="1350" y="1576" class="note" text-anchor="end" direction="rtl">يضغط «إتمام البيع» ✅</text>

  <rect x="550" y="1415" width="400" height="200" rx="18" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
  <text x="920" y="1460" class="tag" text-anchor="end" direction="rtl">🛒 من متجر أونلاين</text>
  <text x="920" y="1500" class="note" text-anchor="end" direction="rtl">تبعتله لينك</text>
  <text x="920" y="1538" class="note" text-anchor="end" direction="rtl">يختار ويأكّد بنفسه</text>
  <text x="920" y="1576" class="note" text-anchor="end" direction="rtl">يضغط «تأكيد» ✅</text>

  <rect x="120" y="1415" width="400" height="200" rx="18" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
  <text x="490" y="1460" class="tag" text-anchor="end" direction="rtl">🤖 شات بوت واتساب</text>
  <text x="490" y="1500" class="note" text-anchor="end" direction="rtl">أزرار مش كلام حر</text>
  <text x="490" y="1538" class="note" text-anchor="end" direction="rtl">اختار المنتج/الكمية</text>
  <text x="490" y="1576" class="note" text-anchor="end" direction="rtl">يضغط «أكّد» ✅</text>

  <!-- صندوق القاعدة الأوتوماتيكية -->
  <rect x="120" y="1660" width="1260" height="320" rx="20" fill="#0b1220" stroke="#34d399" stroke-width="3"/>
  <text x="1360" y="1710" class="h2" text-anchor="end" direction="rtl" font-size="26">⚙️ القاعدة الأوتوماتيكية اللي بتشتغل لوحدها لما الأوردر يتسجّل</text>

  <text x="1350" y="1760" class="note" text-anchor="end" direction="rtl">الربط بين الرسالة والأوردر بيحصل بـ «رقم التليفون» المشترك:</text>

  <rect x="170" y="1785" width="1160" height="170" rx="14" fill="#020617" stroke="#1e293b" stroke-width="2"/>
  <text x="200" y="1825" font-family="monospace" font-size="22" fill="#7dd3fc">function onNewOrder(order) {</text>
  <text x="240" y="1858" font-family="monospace" font-size="22" fill="#e2e8f0">const c = db.findCustomerByPhone(order.phone);  <tspan fill="#64748b">// طابق الرقم</tspan></text>
  <text x="240" y="1891" font-family="monospace" font-size="22" fill="#e2e8f0">if (c.stage === <tspan fill="#fca5a5">"Lead"</tspan>) c.stage = <tspan fill="#86efac">"Customer"</tspan>;  <tspan fill="#64748b">// حرّكه</tspan></text>
  <text x="240" y="1924" font-family="monospace" font-size="22" fill="#e2e8f0">db.save(c);  <tspan fill="#64748b">// خلاص بقى Customer تلقائيًا ✅</tspan></text>
  <text x="200" y="1924" font-family="monospace" font-size="22" fill="#7dd3fc"></text>
  <text x="200" y="1957" font-family="monospace" font-size="22" fill="#7dd3fc">}</text>

  <line x1="120" y1="2010" x2="1380" y2="2010" stroke="#475569" stroke-width="2"/>
  <text x="750" y="2040" class="note" text-anchor="middle" direction="rtl">رسالة واتساب ← Webhook ← السيرفر يسجّل Lead 🟢   ‹‹   العميل عمل أوردر ← قاعدة أوتوماتيكية ← Lead يتحوّل Customer ✅</text>
</svg>
